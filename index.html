<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reparto">
<title>Reparto Nestle</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><span>🚚 Reparto Nestle<small id="whoami" style="display:block;font-size:13px;font-weight:500;opacity:.85"></small></span><button id="menubtn" aria-label="Menú">☰</button></header>
<datalist id="motivos"></datalist>
<div id="reporte"></div>
<div id="menu"><button id="histbtn">Historial</button><button id="cfgbtn">Configuración</button><button id="reset">Nueva planilla</button><button id="logout">Salir</button></div>
<div id="syncmsg" class="hint" style="display:none;margin:8px 12px"></div>
<main id="app"></main>
<input type="file" id="foto" accept="image/*" capture="environment" hidden>
<input type="file" id="fotog" accept="image/*" multiple hidden>
<div id="fotosheet" style="display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);align-items:flex-end">
  <div style="width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px">
    <button class="btn" data-a="foto-cam">Sacar foto</button>
    <button class="btn" data-a="foto-gal">Elegir de la galería</button>
    <button class="btn sec" data-a="foto-x">Cancelar</button>
  </div></div>
<button id="navfoto">Cargar por foto</button>
<nav>
  <button data-t="planilla">Planilla</button>
  <button data-t="recorrido">Recorrido</button>
  <button data-t="resumen">Resumen</button>
</nav>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
