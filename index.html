<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reparto Nestle</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mut:#6b7280;--pri:#1d4ed8;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--bd:#d1d5db}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--pri:#3b82f6;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--bd:#334155}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,sans-serif;padding-bottom:110px}
header{background:var(--pri);color:#fff;padding:12px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);z-index:5}
#navfoto{position:fixed;left:14px;bottom:76px;z-index:6;width:80px;height:80px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-weight:700;font-size:13px;line-height:1.2;box-shadow:0 4px 12px rgba(0,0,0,.35)}
nav button{flex:1;padding:16px 4px;border:0;background:none;color:var(--mut);font-size:15px;font-weight:700}
nav button.on{color:var(--pri);border-top:3px solid var(--pri);padding-top:13px}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
h2{font-size:16px;margin:4px 0 8px}
input,textarea,select{width:100%;padding:10px 12px;min-height:46px;font-size:16px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}
textarea{min-height:110px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.row>.fit{flex:none}
.btn{padding:12px 14px;min-height:46px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:16px}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:0;min-width:38px;min-height:38px;font-size:17px;border-radius:10px}
.btn.bad{background:var(--bad)}
.mut{color:var(--mut);font-size:14px}
.big{font-size:22px;font-weight:700}
img.foto{width:100%;max-height:260px;object-fit:contain;border-radius:8px;background:#000;margin-top:8px}
.item[data-lp]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:15px;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.item .n{width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.item .n.off{background:var(--mut)}
.item .nm{flex:1;min-width:0}
.item .nm b{white-space:nowrap}
.item .nm .mut{display:none}
.item .nm b{display:block;overflow:hidden;text-overflow:ellipsis}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pays button{padding:16px 6px;min-height:58px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-weight:700;font-size:16px}
.pays button.on{border-color:var(--pri);background:var(--pri);color:#fff}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;white-space:nowrap;font-weight:600;background:var(--bg);border:1px solid var(--bd)}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}
.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:8px 0;border-bottom:1px solid var(--bd)}
.tbl td:last-child{text-align:right;font-weight:700}
.mix{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.mix label{font-size:13px;color:var(--mut)}
.cur{border:2px solid var(--pri)}
.hint{background:#fef3c7;color:#78350f;padding:8px;border-radius:8px;font-size:14px;margin-bottom:8px}
body.login{background:linear-gradient(160deg,var(--pri),#0f172a);min-height:100vh;padding-bottom:0}
.lg{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px}
.lg .logo{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:14px;box-shadow:0 0 0 8px rgba(255,255,255,.1)}
.lg h1{color:#fff;margin:0;font-size:30px;letter-spacing:.5px}
.lg p{color:rgba(255,255,255,.75);margin:4px 0 22px}
.lg .box{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:22px;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.lg label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:0 0 6px;text-transform:uppercase;letter-spacing:.5px}
.lg .pw{position:relative}
.lg .pw button{position:absolute;right:6px;top:4px;height:38px;border:0;background:none;color:var(--pri);font-weight:700;font-size:14px}
.lg .btn{width:100%;margin-top:6px;min-height:52px;font-size:17px}
.sw{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 14px}
.sw button{width:52px;height:52px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--bd)}
.sw button.on{box-shadow:0 0 0 4px var(--tx)}
</style>
</head>
<body>
<header><span>🚚 Reparto Nestle</span><span><button id="histbtn">Historial</button> <button id="cfgbtn">Configuración</button> <button id="reset">Nueva planilla</button> <button id="logout">Salir</button></span></header>
<div id="syncmsg" class="hint" style="display:none;margin:8px 12px"></div>
<main id="app"></main>
<input type="file" id="foto" accept="image/*" capture="environment" hidden>
<button id="navfoto">Cargar por foto</button>
<nav>
  <button data-t="planilla">Planilla</button>
  <button data-t="recorrido">Recorrido</button>
  <button data-t="resumen">Resumen</button>
</nav>

<script>
const METHODS = [
  ['ef','Efectivo'],['tr','Transferencia'],['ch','Cheque'],
  ['ec','E-Cheq'],['cc','Cuenta corriente'],['mix','Pago mixto']
];
const LABEL = Object.fromEntries(METHODS);
const KEYS = ['ef','tr','ch','ec','cc'];
const KEY = 'reparto-v1';

let S = load() || {photo:null, clients:[], tab:'planilla'};
let ordering = null;      // modo "ordenar tocando": array de ids ya tocados
let TOKEN = null;
try{ TOKEN = localStorage.getItem('reparto-token'); }catch(e){}
let loginErr = '', loginUser = '';
let editId = null;        // cliente abierto para editar en Planilla
let sel = null;           // cliente abierto en 'Siguientes'
let mixOpen = null;       // id de cliente con panel mixto abierto
let draft = [{name:'',total:''}];   // filas por cargar (cliente a la izquierda, monto a la derecha)
let ocrBusy = '';

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ try{ const p=S.photo; S.photo=null; localStorage.setItem(KEY, JSON.stringify(S)); S.photo=p; }catch(_){} }
  scheduleSync();
}

/* ---------- Servidor (base de datos) ---------- */
let syncTimer = null, syncing = false, syncAgain = false, dbOff = false, hist = null;
function setSync(msg){ const el=$('#syncmsg'); el.textContent=msg; el.style.display=msg?'':'none'; }
function scheduleSync(){ if(!TOKEN||dbOff) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncSave,800); }
async function api(method, url, data){
  const r = await fetch(url,{method,headers:{'content-type':'application/json',authorization:'Bearer '+TOKEN},body:data?JSON.stringify(data):undefined});
  if(r.status===401){ logout(); throw Object.assign(new Error('401'),{status:401}); }
  const d = await r.json();
  if(!r.ok) throw Object.assign(new Error(d.error||'error'),{status:r.status});
  return d;
}
async function syncSave(){
  clearTimeout(syncTimer); syncTimer=null;
  if(syncing){ syncAgain=true; return; }
  syncing = true;
  try{
    if(!S.pid){
      if(S.clients.length){ S.pid=(await api('POST','/api/planillas',{clients:S.clients})).id; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
    } else await api('PUT','/api/planillas/'+S.pid,{clients:S.clients});
    setSync('');
  }catch(e){
    if(e.status===503) dbOff=true; else if(e.status!==401) setSync('No se pudo guardar en el servidor. Revisá la conexión.');
  }
  syncing = false;
  if(syncAgain){ syncAgain=false; syncSave(); }
}
async function loadRemote(){
  if(!TOKEN||dbOff) return;
  try{
    let d = null;
    if(S.pid){ try{ d = await api('GET','/api/planillas/'+S.pid); }catch(e){ if(e.status!==404) throw e; S.pid=null; } }
    if(!S.pid && !S.clients.length) d = await api('GET','/api/planillas/ultima');
    if(d && d.id){ S.pid=d.id; S.clients=d.data.clients||[]; render(); }
    else if(!S.pid && S.clients.length) syncSave();
    setSync('');
  }catch(e){
    if(e.status===503) dbOff=true; else if(e.status!==401) setSync('Sin conexión con el servidor. Se usan los datos del celular.');
  }
}
async function loadHist(){
  hist = null; render();
  try{ hist = (await api('GET','/api/planillas')).planillas; }
  catch(e){ hist = e.status===503 ? 'off' : 'error'; }
  render();
}
const fechaLarga = iso => new Date(iso).toLocaleString('es-AR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const COLORS = ['#1d4ed8','#dc2626','#16a34a','#ea580c','#7c3aed','#0891b2','#db2777','#334155'];
let COLOR = null;
try{ COLOR = localStorage.getItem('reparto-color'); }catch(e){}
function applyColor(c){
  if(!c) return;
  COLOR = c; document.documentElement.style.setProperty('--pri', c);
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.content = c;
  try{ localStorage.setItem('reparto-color', c); }catch(e){}
}
applyColor(COLOR);
function vConfig(){
  const cur = (COLOR||COLORS[0]).toLowerCase();
  return `<div class="card"><h2>Color de la app</h2>
    <div class="sw">${COLORS.map(c=>`<button style="background:${c}" class="${c===cur?'on':''}" data-a="color" data-c="${c}"></button>`).join('')}</div>
    <h2>Otro color</h2>
    <input type="color" id="colorpick" value="${cur}" style="height:56px;padding:4px">
    <div class="row" style="margin-top:14px"><button class="btn sec" data-a="color" data-c="${COLORS[0]}">Volver al original</button></div>
  </div>`;
}
function vHistorial(){
  if(hist===null) return '<div class="card">Cargando…</div>';
  if(hist==='off') return '<div class="card">La base de datos no está configurada en el servidor.</div>';
  if(hist==='error') return '<div class="card">No se pudo cargar el historial.</div>';
  if(!hist.length) return '<div class="card">Todavía no hay planillas guardadas.</div>';
  return `<div class="card"><h2>Historial de planillas</h2>${hist.map(h=>`<div class="item" style="flex-wrap:wrap">
    <div class="nm"><b>${fechaLarga(h.created_at)}</b><span class="mut">${h.clientes} clientes · ${money(Number(h.total))}</span>${h.id===S.pid?' <span class="tag ok">Actual</span>':''}</div>
    <button class="btn sec" data-a="hist-open" data-id="${h.id}">Abrir</button>
    <button class="btn sec sm" data-a="hist-del" data-id="${h.id}">✕</button></div>`).join('')}</div>`;
}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$ ' + (Math.round(n*100)/100).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2});
const sum = c => KEYS.reduce((a,k)=>a+(c.pay[k]||0),0);
const num = v => { v=String(v).trim().replace(/\./g,'').replace(',','.'); const n=parseFloat(v); return isNaN(n)?0:n; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const get = id => S.clients.find(c=>c.id===id);

function addClient(name, total, addr){
  S.clients.push({id:uid(), name:name.trim(), addr:(addr||'').trim(), total:total||0, pay:{}, done:false});
}

/* ---------- Render ---------- */
function render(){
  const logged = !!TOKEN;
  document.querySelector('nav').style.display = $('#navfoto').style.display = document.querySelector('header').style.display = logged ? '' : 'none';
  document.body.classList.toggle('login', !logged);
  if(!logged){ $('#app').innerHTML = vLogin(); return; }
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.t===S.tab));
  $('#app').innerHTML = S.tab==='planilla' ? vPlanilla() : S.tab==='recorrido' ? vRecorrido() : S.tab==='historial' ? vHistorial() : S.tab==='config' ? vConfig() : vResumen();
  save();
}

function vLogin(){
  return `<div class="lg">
    <div class="logo">🚚</div>
    <h1>Reparto Nestle</h1><p>Ingresá para continuar</p>
    <div class="box">
      <label for="l_user">Usuario</label>
      <input id="l_user" autocapitalize="none" autocomplete="username" value="${esc(loginUser)}" style="margin-bottom:14px">
      <label for="l_pass">Contraseña</label>
      <div class="pw"><input id="l_pass" type="password" autocomplete="current-password"><button type="button" data-a="showpass">Ver</button></div>
      ${loginErr?`<div class="hint" style="margin:12px 0 0;background:#fee2e2;color:#7f1d1d">${esc(loginErr)}</div>`:''}
      <button class="btn" style="margin-top:18px" data-a="login">Ingresar</button>
    </div></div>`;
}
function logout(){ TOKEN=null; try{ localStorage.removeItem('reparto-token'); }catch(e){} loginErr=''; render(); }
async function doLogin(){
  loginUser = $('#l_user').value.trim();
  try{
    const r = await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:$('#l_user').value.trim(),pass:$('#l_pass').value})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error||'error');
    TOKEN = d.token; loginErr=''; loadRemote();
    try{ localStorage.setItem('reparto-token', TOKEN); }catch(e){}
  }catch(err){ loginErr = err.message==='Failed to fetch' ? 'Sin conexión' : err.message; }
  render();
}

function vPlanilla(){
  const c = S.clients;
  return `
  <div class="card">
    <h2>Cargar cliente</h2>
    ${ocrBusy?`<div class="hint">${esc(ocrBusy)}</div>`:''}
    ${draft.map((d,i)=>`<div style="margin-bottom:12px">
      <input data-f="dname" data-i="${i}" value="${esc(d.name)}" placeholder="Cliente">
      <div class="row" style="margin-top:8px">
        <input data-f="dtot" data-i="${i}" inputmode="decimal" value="${d.total||''}" placeholder="Monto $" style="text-align:right">
        ${draft.length>1?`<button class="btn sec sm fit" data-a="drow-del" data-i="${i}">✕</button>`:''}
        ${i===draft.length-1?'<button class="btn" data-a="bulk">Cargar a la lista</button>':''}
      </div></div>`).join('')}
  </div>
  <div class="card">
    <h2>Clientes en recorrido (${c.length})</h2>
    ${c.length?[...c].sort((x,y)=>x.name.localeCompare(y.name,'es')).map(x=>editId===x.id?
      `<div class="card cur" style="margin:8px 0">
        <h2>Editar cliente</h2>
        <input data-f="cname" data-id="${x.id}" value="${esc(x.name)}" placeholder="Cliente">
        <input data-f="total" data-id="${x.id}" inputmode="decimal" value="${x.total||''}" placeholder="Monto $" style="margin-top:8px;text-align:right">
        <div class="row" style="margin-top:10px"><button class="btn bad" data-a="del" data-id="${x.id}">Borrar</button><button class="btn" data-a="pedit" data-id="${x.id}">Listo ✔</button></div></div>`
      :`<div class="item" data-a="pedit" data-id="${x.id}">
        <div class="nm"><b>${esc(x.name)}</b></div>
        <b>${money(x.total)}</b></div>`).join(''):'<div class="mut">Todavía no hay clientes.</div>'}
    ${c.length?`<div class="row" style="margin-top:10px"><button class="btn" data-a="go">Empezar recorrido →</button></div>`:''}
  </div>`;
}

function payButtons(c){
  const m = c.method;
  return `<div class="pays">${METHODS.map(([k,l])=>`<button class="${m===k?'on':''}" data-a="pay" data-k="${k}" data-id="${c.id}">${l}</button>`).join('')}
    <button data-a="nopay" data-id="${c.id}" class="${c.done&&!sum(c)&&!c.method?'on':''}" style="grid-column:1/3">No pagó / no estaba</button></div>
  ${mixOpen===c.id?mixPanel(c):''}`;
}
function mixPanel(c){
  const rest = c.total - sum(c);
  return `<div class="mix">${METHODS.filter(m=>m[0]!=='mix').map(([k,l])=>
    `<div><label>${l}</label><input data-f="mix" data-k="${k}" data-id="${c.id}" inputmode="decimal" value="${c.pay[k]||''}" placeholder="0"></div>`).join('')}</div>
    <div class="mut" id="mixrest-${c.id}">${restTxt(rest)}</div>`;
}
const restTxt = r => r===0?'Completo ✔': r>0?`Falta asignar ${money(r)}`:`Te pasaste ${money(-r)}`;

function statusTag(c){
  if(!c.done) return '<span class="tag">Sin visitar</span>';
  const rest = c.total - sum(c), cc = c.pay.cc||0;
  if(rest>0.005) return `<span class="tag bad">Pendiente ${money(rest)}</span>`;
  if(cc>0) return `<span class="tag warn">Cta cte ${money(cc)}</span>`;
  return '<span class="tag ok">Cobrado</span>';
}

function vRecorrido(){
  const c = S.clients;
  if(!c.length) return '<div class="card">Cargá clientes en la pestaña Planilla.</div>';
  const todo = c.filter(x=>!x.done), done = c.filter(x=>x.done);
  if(ordering) return `<div class="card"><h2>Ordenar recorrido</h2>
    <div class="hint">Tocá los clientes en el orden en que los vas a visitar. Van quedando numerados.</div>
    ${todo.map(x=>{ const pos=ordering.indexOf(x.id)+1; return `<div class="item" data-a="pick" data-id="${x.id}">
      <span class="n ${pos?'':'off'}">${pos||'·'}</span><div class="nm"><b>${esc(x.name)}</b><span class="mut">${esc(x.addr)}</span></div><b>${money(x.total)}</b></div>`; }).join('')}
    <div class="row" style="margin-top:12px"><button class="btn sec" data-a="ordreset">Borrar selección</button><button class="btn" data-a="ordend">Listo ✔</button></div></div>`;
  let h = `<div class="mut" style="margin-bottom:8px">Visitados ${done.length} de ${c.length}</div>`;
  if(todo.length){
    if(todo.length) h += `<div class="card"><h2>Pendientes (${todo.length})</h2>
      <div class="mut" style="margin-bottom:6px">Tocá un cliente para cobrarle. Mantené apretado para ordenar.</div>
      <button class="btn sec" style="width:100%;margin-bottom:6px" data-a="ordenar">Ordenar recorrido</button>${todo.map(x=>{
      if(sel!==x.id) return `<div class="item" data-a="sel" data-id="${x.id}" data-lp="1"><span class="n off">${c.indexOf(x)+1}</span><div class="nm"><b>${esc(x.name)}</b></div><b>${money(x.total)}</b>
        <button class="btn sec sm" data-a="up" data-id="${x.id}">↑</button><button class="btn sec sm" data-a="down" data-id="${x.id}">↓</button></div>`;
      return `<div class="card cur" style="margin:8px 0"><div class="big">${esc(x.name)}</div><div class="mut">${esc(x.addr)}</div>
        <div class="big" style="color:var(--pri)">${money(x.total)}</div>${payButtons(x)}
        <div class="row"><button class="btn sec" data-a="sel" data-id="${x.id}">Cerrar</button>${mixOpen===x.id?`<button class="btn" data-a="mixok" data-id="${x.id}">Listo ✔</button>`:''}</div></div>`;}).join('')}</div>`;
  } else {
    h += `<div class="card"><div class="big">Recorrido terminado 🎉</div><div class="row" style="margin-top:10px"><button class="btn" data-a="tosum">Ver resumen</button></div></div>`;
  }
  if(done.length) h += `<div class="card"><h2>Hechos</h2>${done.map(x=>{
    const open = mixOpen===x.id;
    return `<div class="item" style="flex-wrap:wrap"><span class="n">${c.indexOf(x)+1}</span>
      <div class="nm"><b>${esc(x.name)}</b></div>${statusTag(x)}
      <button class="btn sec sm" style="padding:0 10px" data-a="edit" data-id="${x.id}">Editar</button>
      ${open?`<div style="width:100%">${payButtons(x)}<button class="btn" data-a="mixok" data-id="${x.id}">Listo ✔</button></div>`:''}
    </div>`;}).join('')}</div>`;
  return h;
}

function totals(){
  const t = {ef:0,tr:0,ch:0,ec:0,cc:0,sin:0,total:0};
  S.clients.forEach(c=>{
    t.total += c.total;
    KEYS.forEach(k=>t[k]+=c.pay[k]||0);
    t.sin += Math.max(0, c.total - sum(c));
  });
  return t;
}
function vResumen(){
  if(!S.clients.length) return '<div class="card">No hay datos todavía.</div>';
  const t = totals();
  const cobrado = t.ef+t.tr+t.ch+t.ec;
  const pend = S.clients.filter(c=>c.total - sum(c) > 0.005 || (c.pay.cc||0)>0);
  return `
  <div class="card"><h2>Lo que tiene que haber</h2>
    <table class="tbl">
      <tr><td>💵 Efectivo</td><td>${money(t.ef)}</td></tr>
      <tr><td>🏦 Transferencia</td><td>${money(t.tr)}</td></tr>
      <tr><td>📄 Cheque</td><td>${money(t.ch)}</td></tr>
      <tr><td>📱 E-Cheq</td><td>${money(t.ec)}</td></tr>
      <tr><td><b>Total cobrado</b></td><td style="color:var(--ok)">${money(cobrado)}</td></tr>
      <tr><td>📒 Cuenta corriente</td><td>${money(t.cc)}</td></tr>
      <tr><td>⏳ Sin cobrar / sin marcar</td><td style="color:var(--bad)">${money(t.sin)}</td></tr>
      <tr><td><b>Total planilla</b></td><td>${money(t.total)}</td></tr>
    </table>
    <div class="mut" style="margin-top:6px">Visitados ${S.clients.filter(c=>c.done).length} de ${S.clients.length}</div>
  </div>
  <div class="card"><h2>Clientes pendientes a cobrar (${pend.length})</h2>
    ${pend.length?pend.map(c=>{
      const rest = c.total - sum(c), cc = c.pay.cc||0;
      return `<div class="item"><div class="nm"><b>${esc(c.name)}</b><span class="mut">${c.done?'':'Sin visitar · '}${cc>0?'Cta cte '+money(cc):''}${cc>0&&rest>0.005?' · ':''}${rest>0.005?'Sin cobrar '+money(rest):''}</span></div>
      <b>${money(cc+Math.max(0,rest))}</b></div>`;}).join('')
      :'<div class="mut">Nada pendiente ✔</div>'}
    ${pend.length?`<div class="row" style="margin-top:8px"><b>Total pendiente</b><b style="text-align:right">${money(t.cc+t.sin)}</b></div>`:''}
  </div>`;
}

/* ---------- Acciones ---------- */
function setPay(c, k){
  if(k==='mix'){ c.method='mix'; c.done=true; mixOpen=c.id; return; }
  c.method=k; c.done=true; c.pay={[k]:c.total}; mixOpen=null;
}

document.addEventListener('click', e=>{
  if(lpFired){ lpFired=false; return; }
  if(e.target.id==='logout') return logout();
  if(e.target.closest('#navfoto')){ $('#foto').click(); return; }
  const nav = e.target.closest('nav button[data-t]');
  if(nav){ S.tab=nav.dataset.t; mixOpen=null; ordering=null; editId=null; return render(); }
  if(e.target.id==='cfgbtn'){ S.tab='config'; mixOpen=null; sel=null; render(); return; }
  if(e.target.id==='histbtn'){ S.tab='historial'; mixOpen=null; sel=null; loadHist(); return; }
  if(e.target.id==='reset'){
    if(confirm('¿Empezar una planilla nueva? La actual queda guardada en el historial.')){
      (syncTimer ? syncSave() : Promise.resolve()).then(()=>{ S={photo:null,clients:[],tab:'planilla'}; draft=[{name:'',total:''}]; ordering=null; mixOpen=null; render(); });
    }
    return;
  }
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, id = el.dataset.id, c = id&&get(id);
  const i = c ? S.clients.indexOf(c) : -1;
  switch(a){
    case 'login': return doLogin();
    case 'showpass': { const i=$('#l_pass'); i.type = i.type==='password'?'text':'password'; el.textContent = i.type==='password'?'Ver':'Ocultar'; return; }
    case 'color': applyColor(el.dataset.c); break;
    case 'hist-open': api('GET','/api/planillas/'+id).then(d=>{ S.pid=d.id; S.clients=d.data.clients||[]; S.tab='planilla'; render(); }).catch(()=>setSync('No se pudo abrir la planilla.')); return;
    case 'hist-del': if(!confirm('¿Borrar esta planilla del historial?')) return;
      api('DELETE','/api/planillas/'+id).then(()=>{ if(+id===S.pid){ S.pid=null; S.clients=[]; } loadHist(); }).catch(()=>setSync('No se pudo borrar.')); return;
    case 'drow-add': draft.push({name:'',total:''}); break;
    case 'drow-del': draft.splice(+el.dataset.i,1); if(!draft.length) draft.push({name:'',total:''}); break;
    case 'bulk':
      draft.forEach(d=>{ if(d.name.trim()) addClient(d.name, num(d.total)); });
      draft=[{name:'',total:''}]; break;
    case 'pedit': editId = editId===id ? null : id; break;
    case 'del': S.clients.splice(i,1); editId=null; break;
    case 'up': case 'down': {
      const todo = S.clients.filter(x=>!x.done), k = todo.indexOf(c), o = todo[k+(a==='up'?-1:1)];
      if(o){ const j=S.clients.indexOf(o); [S.clients[i],S.clients[j]]=[S.clients[j],S.clients[i]]; }
      break; }
    case 'ordreset': ordering=[]; break;
    case 'ordenar': ordering=[]; break;
    case 'pick':
      if(!ordering.includes(id)) ordering.push(id);
      if(ordering.length===S.clients.filter(x=>!x.done).length) a_finishOrder();
      break;
    case 'ordend': a_finishOrder(); break;
    case 'go': S.tab='recorrido'; break;
    case 'sel': sel = sel===id ? null : id; mixOpen=null; break;
    case 'pay': setPay(c, el.dataset.k); sel=null; break;
    case 'nopay': sel=null; c.method=null; c.pay={}; c.done=true; mixOpen=null; break;
    case 'mixok': mixOpen=null; break;
    case 'skip': S.clients.splice(i,1); S.clients.push(c); break;
    case 'edit': mixOpen = mixOpen===id ? null : id; break;
    case 'tosum': S.tab='resumen'; break;
  }
  render();
});

function a_finishOrder(){
  const todo = S.clients.filter(x=>!x.done);
  const first = ordering.map(get).filter(Boolean);
  S.clients = S.clients.filter(x=>x.done).concat(first, todo.filter(x=>!ordering.includes(x.id)));
  ordering = null;
}

let lpTimer = null, lpFired = false;
document.addEventListener('pointerdown', e=>{
  const it = e.target.closest('[data-lp]'); if(!it || e.target.closest('button')) return;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(()=>{ lpFired=true; ordering=[it.dataset.id]; render(); }, 600);
});
['pointerup','pointercancel','pointermove','pointerleave'].forEach(t=>document.addEventListener(t, ()=>clearTimeout(lpTimer)));
document.addEventListener('contextmenu', e=>{ if(e.target.closest('[data-lp]')) e.preventDefault(); });

document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='l_pass') doLogin(); });

document.addEventListener('input', e=>{
  if(e.target.id==='colorpick'){ applyColor(e.target.value); return; }
  const f = e.target.dataset.f; if(!f) return;
  if(f==='cname'){ const c=get(e.target.dataset.id); if(c){ c.name=e.target.value; save(); } return; }
  if(f==='dname'||f==='dtot'){ draft[+e.target.dataset.i][f==='dname'?'name':'total']=e.target.value; return; }
  const c = get(e.target.dataset.id); if(!c) return;
  if(f==='total'){ c.total = num(e.target.value);
    if(c.method && c.method!=='mix') c.pay={[c.method]:c.total}; save(); }
  if(f==='mix'){ c.pay[e.target.dataset.k] = num(e.target.value);
    const r=$('#mixrest-'+c.id); if(r) r.textContent = restTxt(c.total-sum(c)); save(); }
});

/* ---------- Foto + OCR ---------- */
document.addEventListener('change', e=>{
  if(e.target.id!=='foto' || !e.target.files[0]) return;
  const img = new Image(), url = URL.createObjectURL(e.target.files[0]);
  img.onload = ()=>{
    const sc = Math.min(1, 1600/Math.max(img.width,img.height));
    const cv = document.createElement('canvas');
    cv.width=img.width*sc; cv.height=img.height*sc;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    S.photo = cv.toDataURL('image/jpeg',.8);
    URL.revokeObjectURL(url); e.target.value=''; S.tab='planilla'; runOCR();
  };
  img.src = url;
});

async function runOCR(){
  if(ocrBusy) return;
  try{
    ocrBusy='Leyendo con IA…'; render();
    const r = await fetch('/api/leer',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+TOKEN},body:JSON.stringify({image:S.photo})});
    if(r.status===401){ ocrBusy=''; S.photo=null; return logout(); }
    const d = await r.json();
    if(!r.ok) throw new Error(d.error||'error');
    const rows = d.clients.map(c=>({name:c.name, total:c.total||''}));
    if(rows.length) draft = rows;
    else alert('No se encontraron clientes. Cargalos a mano.');
  }catch(err){ alert('No se pudo leer la foto ('+err.message+'). Cargá los clientes a mano mirando la foto.'); }
  ocrBusy=''; S.photo=null; render();
}

render();
loadRemote();
</script>
